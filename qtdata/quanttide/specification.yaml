metadata:
  name: liangchao-digital
  version: "0.1.0"
  description: 量潮科技数字化（第一期）— 议事决议数据治理
spec:
  contract:
    name: liangchao-digital-resolution
    description: 量潮科技议事决议数据的档案契约

    input:
      proposal_docs:
        type: string
        doc: 飞书提案文档（编号、提案人、poll 标记）
        constraint: required, exported via lark-cli drive +export
      meeting_notes:
        type: string
        doc: 会议纪要（议程结构、决定类记录）
      dept_briefings:
        type: string
        doc: 部门简报

    output:
      id:
        type: string
        doc: 决议唯一标识
        guarantee: unique per resolution, non-empty
      title:
        type: string
        doc: 决议标题
        guarantee: non-empty
      content:
        type: string
        doc: 决议内容
      owner:
        type: string
        doc: 责任人
        guarantee: 缺失时标记"未指定"，治理视图提示补全——创建决议时 owner 必填
      due:
        type: date
        doc: 完成期限
        guarantee: 可为空；缺失时跳过逾期推导，不误报（期限缺失本身是治理信号）
      status:
        type: enum
        values: [open, done]
        doc: 决议状态（逾期由治理输出推导）
      vote:
        type: string
        doc: poll 表决记录
      source:
        type: string
        doc: 溯源（原始文档 + 段落定位）
        guarantee: traceable back to original document
      evidence:
        type: string
        doc: 提取证据（决定类动词：决定/通过/落实/确定）
      history:
        type: string
        doc: 变更历史

  blueprint:
    name: liangchao-digital-resolution
    description: 从飞书议事档案中提取、标准化决议，输出治理视图与周会报告
    contract: liangchao-digital-resolution

    steps:
      - name: 采集原始数据
        description: 飞书议事档案导出（lark-cli drive +export：提案/会议纪要/简报）
        expectation: 原始议事文档集
      - name: 解析文档结构
        description: 提取编号、提案人、poll 标记、议程结构
        expectation: 结构化文档解析结果
      - name: 决议标准化
        description: 对齐决议 schema（id/title/owner/due/status/溯源）
        expectation: 符合契约的决议记录
      - name: 纪要决议提取
        description: 从议程中提取决定类记录（决定/通过/落实/确定）
        expectation: 决议候选清单（含证据）
      - name: 档案落库
        description: 一决议一文件（YAML），索引聚合
        expectation: 决议档案集 + index.yaml
      - name: 治理输出
        description: 逾期推导、责任人分布、治理视图 JSON
        expectation: stats/overdue/by_owner/resolutions 治理视图
      - name: 周会报告
        description: 生成周会决议汇总与质量指标（编号错位/辩论记录/决议落档）
        expectation: 周会决议汇总报告 + 质量基线

    exceptions:
      - label: 无责任人
        strategy: 标记"未指定"，治理视图提示补全——创建决议时 owner 必填
      - label: 无完成期限
        strategy: 逾期推导跳过，不误报——期限缺失本身是治理信号
      - label: 编号双轨
        strategy: 提案按发布周、会议按召开周编号，跨文档错位检测（错位率 100%）
      - label: 纪要无决议记录
        strategy: 标记表决-决议断链，提示表决引擎/决议归档缺失
